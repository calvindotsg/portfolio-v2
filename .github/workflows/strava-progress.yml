name: strava-progress

on:
  schedule:
    # 21:13 UTC = 05:13 SGT — after a full Singapore day; off the top of the
    # hour to avoid GitHub's peak scheduling delays.
    - cron: "13 21 * * *"
  workflow_dispatch: {}   # manual runs, and re-enabling after auto-disable

# `actions: write` is what lets the last step dispatch `ci.yml`, and it has to be
# written here rather than assumed: a `permissions:` block REPLACES the defaults
# wholesale, so before this line `actions` was `none` and the dispatch would have
# returned 403 — on the one path nobody watches. It is also independent of the
# repository's `default_workflow_permissions`, which is `read`; an explicit block
# is the only way a job gets more than that.
permissions:
  contents: write
  actions: write

# A manual run overlapping the cron would push the same file from two checkouts;
# the second push is then rejected non-fast-forward. Never cancel in flight —
# that could kill a run between its commit and its push.
concurrency:
  group: strava-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # THE REF TEST THE OTHER TWO CREDENTIALED JOBS ALREADY HAD, on the one that holds the most.
    # `deploy-production` in `ci.yml` and `apply` in `dns.yml` both carry this comparison; this
    # job did not, and it is the job with `contents: write`, `actions: write` and both Strava
    # secrets. Without it a `workflow_dispatch` on ANY ref — every branch and every tag in the
    # repository, including one pushed for the purpose — runs `scripts/fetch-strava-progress.mjs`
    # from that ref with those credentials, and dispatches the production deploy afterwards.
    #
    # ASSESSED HONESTLY IT IS A LATERAL MOVE RATHER THAN AN ESCALATION: dispatching a workflow
    # needs write access already. What it is, is the quietest path to those secrets, because the
    # push step commits nothing when the kilometres have not moved — so the run leaves no commit
    # on `main` and nothing but an Actions entry nobody reads.
    #
    # IT COSTS THE NIGHTLY NOTHING, and that is a fact about the platform rather than a hope.
    # GitHub runs a scheduled workflow only on the default branch — "Scheduled workflows will
    # only run on the default branch" — and sets `github.ref` to that branch for the run, so the
    # cron satisfies this test by construction. `tests/workflow-guards.test.ts` EXECUTES this
    # expression against a scheduled context rather than reading it, for exactly that reason.
    if: github.ref == 'refs/heads/main'
    steps:
      # Pinned to a full commit SHA, not a tag, because the repository is about to
      # enable `sha_pinning_required` and GitHub's documentation states no exemption
      # for GitHub-authored actions or for immutable tags — `@v5` is a tag, so the
      # policy would fail this job on its next nightly run with nothing watching.
      # IT STARTED AS A PIN RATHER THAN AN UPGRADE: the first SHA written here was exactly
      # what `@v5` resolved to. Dependabot has since moved it to v7.0.1 (#159), which is
      # the next sentence working as designed — so this one is past-tensed rather than
      # deleted, because "why is this a SHA" and "why is it THIS SHA" are two questions and
      # only the second one moved.
      #
      # THE BUMP CROSSED TWO MAJORS, AND THE THING TO CHECK WAS NOT THE MAJOR NUMBER. The
      # push below carries no token and no remote URL: it relies entirely on the credentials
      # this step persists. `persist-credentials` still defaults to `true` — verified by
      # reading the action's own input manifest at both the old and the new pinned SHA,
      # rather than trusting release notes — so the bump is inert here. If a future bump
      # flips that default, this job fails at `git push`, nightly, with nothing watching.
      #
      # Dependabot can bump a SHA but cannot convert a tag into one, so any new
      # `uses:` line has to be written pinned by hand.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch YTD totals and write src/data/strava-progress.json
        # ubuntu-latest ships node >= 20 preinstalled (22.x on 24.04) —
        # built-in fetch, zero deps, no setup-node needed.
        env:
          # THE SPLIT HERE IS THE PROJECT'S OWN TEST — "does the value ship publicly?", not
          # "does it feel private". The first two fail that test and are variables; the last
          # two pass it and stay secrets.
          #
          # The athlete id is public on the site's Strava links. A Strava CLIENT ID is public
          # by protocol: it is a query parameter of the OAuth authorize URL, so anyone who has
          # connected the app has already seen it in their address bar. Storing a public value
          # as a secret costs something real and buys nothing — GitHub masks it, so it prints
          # as `***` exactly when you are trying to read what the job sent, and a secret cannot
          # be read back at all, which makes drift against the 1Password copy undetectable.
          #
          # The client SECRET and the refresh TOKEN are what actually authenticate, so they
          # stay secrets — and 1PASSWORD (`calvindotsg-strava`) IS THE SOURCE OF TRUTH FOR
          # BOTH, while the two secrets below are a COPY of it. That is the wrong way round
          # from how it reads: a GitHub secret cannot be read back, so it can be compared
          # with nothing and recovered from nothing, which makes the readable store the only
          # one that can be authoritative. It follows that only a caller who can reach
          # 1Password may CHANGE either credential, and that it writes 1Password before
          # re-copying to GitHub. This job cannot reach it, so it writes neither store — see
          # `scripts/strava-auth.mjs` for what a rotation costs here, and `pnpm strava:sync`
          # for the tool that re-copies the refresh token, which is the one of the two that
          # rotates. The client secret has no re-copy tool because nothing rotates it: it
          # changes only when a person changes it in the Strava app, and then both stores are
          # updated by hand.
          STRAVA_ATHLETE_ID: ${{ vars.STRAVA_ATHLETE_ID }}
          STRAVA_CLIENT_ID: ${{ vars.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/fetch-strava-progress.mjs
      - name: Commit and push only if the km values changed
        run: |
          if git diff --quiet -- src/data/strava-progress.json; then
            echo "Progress unchanged; nothing to commit. Today's build still runs — the site's clock moved even if the kilometres did not. See the next step."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/strava-progress.json
          # shellcheck disable=SC2016
          # The `${...}` below are a JS template literal read by `node -e`, not shell
          # parameters, and the single quotes are what keep the shell's hands off them.
          #
          # WHAT THE DOUBLE QUOTES SHELLCHECK ASKS FOR ACTUALLY DO, measured rather than
          # reasoned, because the first version of this comment guessed and got the ending
          # wrong. Bash tries to expand `${p.cycling_km}`, which is not a valid parameter
          # name, so it prints `bad substitution` and the substitution yields an EMPTY
          # string. That is NOT fatal on its own — in argument position it does not even
          # stop the step under Actions' `bash -e` — so the step gets as far as
          # `git commit -m ""`, and it is GIT that refuses: "Aborting commit due to empty
          # commit message", exit 1. The step therefore fails LOUDLY and nothing is
          # pushed. The one outcome that cannot happen is the silent numberless commit
          # this comment used to warn about, so do not "fix" the quoting to prevent it.
          git commit -m "$(node -e 'const p=require("./src/data/strava-progress.json"); console.log(`chore(goals): update Strava progress to ${p.cycling_km} km ride / ${p.running_km} km run`)')"
          git push

      # THE ONLY UNATTENDED DEPLOY THE SITE HAS. A push made with `GITHUB_TOKEN` does not
      # trigger a workflow run — GitHub suppresses it to stop recursion — so the commit above
      # reaches `main` and, on its own, nothing builds. Netlify never had this problem because
      # its webhook watched the repository rather than the Actions event stream; moving the
      # build into Actions moved this failure mode in with it. `workflow_dispatch` is one of
      # the two documented exceptions to the suppression rule, which is why the fix is a
      # dispatch and not, say, a second push or a tag.
      #
      # INDEPENDENT OF WHETHER ANYTHING WAS COMMITTED, and this is the part that is NOT mere
      # Netlify parity. The step above commits only when the KILOMETRES moved, but the site has a clock as well as
      # a distance: `BUILD_DATE` in `src/lib/today.ts` feeds the countdown, `patchState`,
      # `patchWall` and `nextRace`, and every one of those turns over at Singapore midnight
      # whether or not the owner trained. Firing only on a commit therefore reinstates, by a
      # different mechanism, the exact defect CLAUDE.md records being fixed once already — the
      # home page reading "in 5 days" on the day it was 4, frozen for as long as the owner
      # rested. MEASURED before writing this: the cron ran and succeeded every day from
      # 2026-07-22 to 2026-07-30, and committed nothing on 07-24, so that day the live site was
      # never rebuilt. One build a night is the fix, and it is also the cheapest possible
      # heartbeat for an unattended pipeline: a broken build is discovered within a day instead
      # of whenever the owner next happens to ride.
      #
      # A FAILED STEP ABOVE MUST NOT COST THE DAY'S BUILD, which is a reversal, so the
      # argument it replaces is written out rather than deleted. This step used to run under
      # the implicit `if: success()` on the reasoning that "a failed push must not deploy …
      # rather than publishing a tree that is not on `main`". That premise is false: the
      # dispatch names a REF, so `ci.yml` checks out `main` and builds whatever is on it. The
      # runner's own checkout — pushed or not — never reaches the deploy. So a failed push
      # cost the site its daily rebuild and bought nothing, and a credential failure in the
      # fetch step cost the same thing for the same non-reason. The kilometres are one of the
      # two things this workflow moves; the CLOCK is the other, and it turns over whether or
      # not the token worked.
      #
      # `!cancelled()` RATHER THAN `always()`, and the difference is not stylistic.
      # `always()` also fires when a human presses Cancel or when a concurrency rule kills the
      # run, which turns a deliberate stop into a deploy — the one outcome nobody asked for.
      # `!cancelled()` runs on success and on failure and stops on a cancel, which is exactly
      # the intent.
      #
      # HOW THIS FAILS LOUDLY, which is the whole reason WP4 exists as its own piece of work.
      # `gh workflow run` exits non-zero when the API refuses — a missing `actions: write`
      # scope, a disabled workflow, a ref with no `workflow_dispatch` trigger — so the job goes
      # red, and a red scheduled run is the only alerting this path has. Know who that reaches:
      # GitHub sends a scheduled workflow's failure notification to whoever LAST EDITED THE CRON
      # SYNTAX in this file, not to the repository owner and not to whoever wrote the step that
      # broke. What the step does NOT do is wait for the dispatched run, so green here means
      # "the build was asked for", never "the build passed". Read the CI run itself.
      - name: Ask CI to build and deploy, since the push above triggers nothing
        if: '!cancelled()'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh workflow run ci.yml --ref main; then
            echo "::error::could not dispatch ci.yml on main, so today's build and deploy did not happen. Nothing else in this repository will notice — check the actions:write permission on this workflow and that ci.yml is enabled."
            exit 1
          fi
          echo "Dispatched ci.yml on main. This step does not wait for it; follow it at:"
          echo "https://github.com/${GITHUB_REPOSITORY}/actions/workflows/ci.yml"
