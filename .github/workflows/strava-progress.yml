name: strava-progress

on:
  schedule:
    # 21:13 UTC = 05:13 SGT — after a full Singapore day; off the top of the
    # hour to avoid GitHub's peak scheduling delays.
    - cron: "13 21 * * *"
  workflow_dispatch: {}   # manual runs, and re-enabling after auto-disable

permissions:
  contents: write

# A manual run overlapping the cron would push the same file from two checkouts;
# the second push is then rejected non-fast-forward. Never cancel in flight —
# that could kill a run between its commit and its push.
concurrency:
  group: strava-progress
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a tag, because the repository is about to
      # enable `sha_pinning_required` and GitHub's documentation states no exemption
      # for GitHub-authored actions or for immutable tags — `@v5` is a tag, so the
      # policy would fail this job on its next nightly run with nothing watching.
      # This is a PIN, not an upgrade: the SHA is exactly what `@v5` resolved to.
      # Dependabot can bump a SHA but cannot convert a tag into one, so any new
      # `uses:` line has to be written pinned by hand.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Fetch YTD totals and write src/data/strava-progress.json
        # ubuntu-latest ships node >= 20 preinstalled (22.x on 24.04) —
        # built-in fetch, zero deps, no setup-node needed.
        env:
          # Not a secret — the athlete id is public on the site's Strava links.
          STRAVA_ATHLETE_ID: ${{ vars.STRAVA_ATHLETE_ID }}
          STRAVA_CLIENT_ID: ${{ secrets.STRAVA_CLIENT_ID }}
          STRAVA_CLIENT_SECRET: ${{ secrets.STRAVA_CLIENT_SECRET }}
          STRAVA_REFRESH_TOKEN: ${{ secrets.STRAVA_REFRESH_TOKEN }}
        run: node scripts/fetch-strava-progress.mjs
      - name: Commit and push only if the km values changed
        run: |
          if git diff --quiet -- src/data/strava-progress.json; then
            echo "Progress unchanged; no commit, no deploy."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/strava-progress.json
          # shellcheck disable=SC2016
          # The `${...}` below are a JS template literal read by `node -e`, not shell
          # parameters, and the single quotes are what keep the shell's hands off them.
          #
          # WHAT THE DOUBLE QUOTES SHELLCHECK ASKS FOR ACTUALLY DO, measured rather than
          # reasoned, because the first version of this comment guessed and got the ending
          # wrong. Bash tries to expand `${p.cycling_km}`, which is not a valid parameter
          # name, so it prints `bad substitution` and the substitution yields an EMPTY
          # string. That is NOT fatal on its own — in argument position it does not even
          # stop the step under Actions' `bash -e` — so the step gets as far as
          # `git commit -m ""`, and it is GIT that refuses: "Aborting commit due to empty
          # commit message", exit 1. The step therefore fails LOUDLY and nothing is
          # pushed. The one outcome that cannot happen is the silent numberless commit
          # this comment used to warn about, so do not "fix" the quoting to prevent it.
          git commit -m "$(node -e 'const p=require("./src/data/strava-progress.json"); console.log(`chore(goals): update Strava progress to ${p.cycling_km} km ride / ${p.running_km} km run`)')"
          git push
