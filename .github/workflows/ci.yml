# The site's only builder.
#
# THE ONE ORDERING PROPERTY THIS FILE EXISTS TO HOLD. On Netlify, "a failing suite
# blocks the deploy" was a property of the platform: the build command WAS the suite,
# so a red suite could not produce a deploy. Here it is a property of this file —
# `needs: build` — which a careless refactor removes silently. If you are rearranging
# these jobs, that edge is the thing you must not drop; `tests/workflow-guards.test.ts`
# is what now notices, and it EXECUTES the `if:` expressions rather than reading them.
#
# THE JOB GRAPH, and why nothing that gates is downstream of a deploy:
#
#   build ──┬── deploy-preview      (pull_request from THIS repo)
#           └── deploy-production   (push to main, or workflow_dispatch)
#
# An earlier draft of the plan put a `verify` job between build and deploy that ran
# "against the deployed preview URL" — which cannot be ordered, because the URL does
# not exist until the deploy it is meant to gate has already happened. The resolution
# is not a cleverer ordering: every blocking check belongs HERE, in `build`, where it
# runs against the artifact, and anything needing a live URL is reporting rather than
# gating.
#
# EVERY `permissions:` BLOCK BELOW REPLACES THE DEFAULTS WHOLESALE. An unlisted scope
# is `none`, which is the intent — and is also how a job loses a scope it silently
# depended on. `contents: read` is all this needs; nothing writes to the repo and
# nothing comments on the PR.

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Supersede an in-flight run for the same PR, but NEVER for main. Cancelling a main run
# between build and deploy would leave production on an older artifact behind a run that
# reads as cancelled-not-failed — a state nobody investigates. Both keys accept expressions;
# this is one of the few places it matters.
#
# THE EVENT NAME IS PART OF THE KEY ON PURPOSE, and `cancel-in-progress: false` is not what
# covers it. That flag only protects a run that has already STARTED; GitHub cancels the
# PENDING member of a group when a new one queues. Keying both `push` to main and
# `workflow_dispatch` on main as `ci-refs/heads/main` therefore let a push silently cancel a
# queued nightly Strava dispatch — again reading as cancelled-not-failed, on the one deploy
# path that is unattended.
#
# WHAT THE SPLIT COSTS, because an earlier version of this comment claimed it was free and was
# wrong. Separating the groups lets a push and a dispatch on main build CONCURRENTLY, and
# `pages-production` at job level then SERIALISES the two deploys without ORDERING them:
# GitHub releases pending members of a group first-in-first-out by the time each started
# WAITING, "not the time each workflow was dispatched", and states plainly that "ordering is
# not guaranteed". So whichever build finishes later publishes later, and production can end
# up on the older of two same-day artifacts. Nothing here checks that. The trade is still the
# right way round — the cancellation it replaces was certain and total, this inversion is rare
# and self-heals on the next push — but it is a trade, not a free win.
#
# WP4 LOOKED AT FIXING THAT AND DELIBERATELY DID NOT, so nobody goes hunting for a fix that was
# never written. The nightly dispatch WP4 adds makes `workflow_dispatch` on main a daily event
# rather than a rare manual one, but it lands at 05:13 SGT, so it only collides with a push
# made within minutes of that. The fix itself is the problem: a monotonicity check has to know
# whether the currently-live deployment's commit is a DESCENDANT of this one, which is a git
# ancestry question, and these jobs have no checkout by design — see the block above
# `deploy-preview`. Comparing `github.run_number` or the wrangler timestamps instead answers a
# different question and would pass exactly when the inversion happens. Whatever replaces this
# must fail the JOB: a `run:` step calling `exit 0` ends only the step, and wrangler would
# publish anyway.
concurrency:
  group: ci-${{ github.event.pull_request.number || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Pinned deliberately — but read the limit stated honestly in the deploy step: this pins
  # wrangler's OWN version, not its dependency tree.
  WRANGLER_VERSION: "4.114.0"
  PAGES_PROJECT: calvindotsg
  # THE ONE OUTBOUND CALL THE BUILD MAKES, TURNED OFF. `astro build` POSTs once per build to
  # the Astro telemetry endpoint. The payload is anonymous — tool versions, OS and CPU, config
  # KEYS without their values, a hash of the first commit — and the response is never read, so
  # the security value of this line is close to nil and it is not sold as more.
  #
  # WHAT IT BUYS IS THE PROPERTY, NOT THE PAYLOAD: it is the only thing between this build and
  # being hermetic, it leaves the job that executes fork-pull-request-authored code, and it
  # fires on every unattended nightly deploy where nobody is watching.
  #
  # `isCI` DOES NOT ALREADY DO THIS, which is the assumption worth writing down because it
  # reads as though it should. Measured by reading the installed telemetry package: the record
  # is suppressed only by an explicit opt-out — the variable set below, its unprefixed sibling,
  # or a persisted choice on the machine — while `isCI` gates just the interactive first-run
  # NOTICE. The check is a truthiness test, so any non-empty value works; "1" is the spelling
  # that package's own README uses.
  #
  # A CONSTANT RATHER THAN CONFIGURATION, so it does not belong in a repository variable: it
  # has no per-environment value, and nothing outside this file reads it.
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: build and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # THE HALF OF THE BRANCH-POLICY INVARIANT THAT USED TO BE UNTESTABLE, MADE TESTABLE.
      #
      # `deploy-production` leans on a structural control rather than on its own `if:`: the
      # `production` environment holds `CLOUDFLARE_API_TOKEN` behind a deployment branch policy
      # limited to `main`, so a job on another ref cannot read the secret at all. That control
      # is meaningful only while the token exists ONLY as an environment secret. A
      # repository-level secret of the same name is inherited by every job that omits
      # `environment:` — including this one — and the branch policy is then void with nothing
      # reporting it. That is a GitHub SETTINGS mistake, not a mistake in this file, which is
      # why nothing in `tests/workflow-guards.test.ts` could see it and why the fix, if this
      # ever fails, is in repository settings rather than here.
      #
      # This job declares no `environment:`, so on a correctly configured repository the value
      # below is the empty string and this step passes. It is first because it needs nothing —
      # no checkout, no toolchain — and because a voided branch policy should stop the run
      # before it does any work.
      #
      # THE EXPOSURE IS SAME-REPO BRANCHES, NOT FORKS, and getting that backwards would sell
      # this step on a threat it does not address: `ci.yml` triggers on `pull_request` and
      # GitHub withholds secrets from fork-PR runs and from Dependabot-triggered runs alike, so
      # neither can read an inherited secret either. What a repository-level copy actually
      # costs is the branch policy — the one control here that a refactor cannot drop, because
      # it does not live in this file.
      #
      # THE VALUE IS NEVER PRINTED, on any path. Reproducing a secret into a log is the defect
      # this step exists to detect, committed by the detector; emptiness is the whole question
      # and testing it needs no echo.
      - name: the deploy token must be unreadable outside a deployment environment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::this job declares no environment: and still read a value for CLOUDFLARE_API_TOKEN, so a repository-level or organisation-level secret of that name exists. Every job that omits environment: now inherits the deploy token, and the production environment's main-only deployment branch policy protects nothing. Delete the repository-level secret; the token belongs to the preview and production environments only."
            exit 1
          fi
          echo "CLOUDFLARE_API_TOKEN is unreadable here, so the production branch policy still binds it."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

      - run: pnpm eslint

      # `pnpm test` runs `pnpm build` first via vitest's globalSetup, so the artifact
      # uploaded below IS the artifact the suite asserted against. That identity is
      # why the deploy jobs will never rebuild.
      - run: pnpm test
        env:
          UMAMI_ID: ${{ vars.UMAMI_ID }}

      # Umami fails OPEN, which is why this is a step and not a code-review note.
      # `data-website-id={import.meta.env.UMAMI_ID}` drops the whole attribute when the
      # value is unset, and the <script> still loads — so the page looks correct,
      # returns 200, and records nothing. Measured on a local build with the variable
      # absent: `<script defer src="https://cloud.umami.is/script.js">`, no attribute.
      #
      # Skipped for fork PRs on purpose: they are never deployed, so demanding this
      # repository's analytics id of them would redden the seven historical
      # upstream-sync PRs for a property that cannot matter to them.
      #
      # DEPENDABOT IS THE THIRD CASE, and the fork guard alone does not catch it: its
      # branches live IN this repository, so `head.repo` matches and the guard admits
      # the run — but GitHub treats Dependabot-triggered runs as fork-like. Secrets are
      # documented as withheld; whether `vars` is withheld too is documented NOWHERE,
      # which is the reason to skip rather than to gamble. The asymmetry decides it: a
      # bot PR that bumps an action SHA cannot affect analytics, so skipping costs
      # nothing, while guessing wrong reddens every one of them. Keyed on the ACTOR,
      # not on `pull_request.user.login` — secret availability tracks whoever triggered
      # the run, so a human pushing onto a dependabot branch correctly gets the check
      # back. This is live rather than hypothetical: `.github/dependabot.yml` declares
      # three ecosystems and started opening pull requests once the repository left the
      # fork network.
      #
      # Asserted over EVERY built page and against the id's actual VALUE. The tag comes
      # from `BasicLayout.astro`, which wraps all four pages, so asking `dist/index.html`
      # alone was a build-wide question put to one page — the repo has a named doctrine
      # and a `builtPages()` helper for exactly that mistake. The old pattern was also a
      # length check wearing a UUID costume: `[0-9a-f-]\{36\}` accepts 36 dashes and
      # rejects a valid upper-case id. Comparing to `$UMAMI_ID` is both stricter and
      # simpler, and catches the paste-the-wrong-uuid case no pattern can.
      - name: analytics must not have been silently dropped
        if: >-
          github.actor != 'dependabot[bot]'
          && (github.event_name != 'pull_request'
          || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          UMAMI_ID: ${{ vars.UMAMI_ID }}
        run: |
          if [ -z "$UMAMI_ID" ]; then
            echo "::error::the UMAMI_ID repository variable is unset or unreadable, so every page built without a data-website-id."
            exit 1
          fi
          pages=$(find dist -name '*.html')
          if [ -z "$pages" ]; then
            echo "::error::dist contains no HTML at all — this check would otherwise pass vacuously."
            exit 1
          fi
          fail=0
          for f in $pages; do
            if ! grep -q "data-website-id=\"$UMAMI_ID\"" "$f"; then
              echo "::error file=$f::no data-website-id=\"$UMAMI_ID\" — the umami script still loads here and records nothing."
              fail=1
            fi
          done
          [ "$fail" = 0 ]

      # `include-hidden-files` is what makes the identity claim above TRUE. The action
      # defaults it to `false`, so any dot-prefixed path under `dist/` is present for
      # every assertion the suite just made and then silently absent from the artifact
      # the deploy jobs will publish — and `if-no-files-found: error` cannot see it,
      # because that fires only when the whole path is empty. There is no such file
      # today; the ordinary way to create one is a `public/.well-known/` entry
      # (domain verification, `security.txt`), which every local preview and the
      # outgoing host would serve and the new host would 404, on a green run.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────────────────
  # THE TWO DEPLOY JOBS. Neither rebuilds: they download the artifact the `build` job
  # asserted against, so what ships is what the suite gated. `needs: build` is the edge
  # that makes a red suite block a deploy — the property Netlify gave us for free by
  # making the build command BE the suite. Nothing here re-runs the tests, so that edge
  # is the whole of it. Do not remove it, and do not add a gating check downstream of a
  # deploy: anything that needs a live URL is reporting, not gating.
  #
  # WHAT "RUNS NO REPO CODE" DOES AND DOES NOT MEAN. No repository SOURCE is executed in
  # the runner — there is no checkout and no `pull_request_target`. It is not a claim that
  # a PR cannot influence these jobs: for a `pull_request` the workflow definition itself
  # comes from the PR's own merge ref, so a same-repo PR can add a step here and it runs
  # with the preview token. The exposure set for that is push access, which is one person.
  # ─────────────────────────────────────────────────────────────────────────────────────

  deploy-preview:
    name: deploy preview
    needs: build
    # Three conditions, and the third is not redundant with the second. Fork PRs have no
    # secrets, so the job would fail opaquely rather than skip. DEPENDABOT branches live IN
    # this repository, so `head.repo` matches and the fork guard admits them — but GitHub
    # treats Dependabot-triggered runs as fork-like and withholds Actions secrets, so
    # wrangler would die non-interactively on every bot PR. Keyed on the ACTOR rather than
    # `pull_request.user.login`, which is frozen at the PR author and would get a human
    # pushing a commit onto a bot branch backwards.
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    # Defence in depth only: the workflow-level group already cancels the whole run for the
    # same PR, so two of these can never contend today. Kept because it is what holds the
    # line if the workflow-level `cancel-in-progress` is ever set to false, and spelled with
    # the same expression as that group so the two cannot drift apart.
    concurrency:
      group: pages-preview-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # THE ARTIFACT IS PERISHABLE AND NOTHING ELSE CHECKS ITS AGE. The build stamps the
      # Singapore calendar day into every page, and "re-run failed jobs" does NOT re-run
      # `build` — so a deploy that fails at 23:xx SGT and is re-run the next morning
      # republishes yesterday's dist: wrong build-date, wrong countdown, and races finished
      # overnight still drawn as unearned outlines. Netlify could not hit this, because its
      # retry re-ran the build command and re-derived the day; this design cannot.
      # MEASURED: the suite is 319/319 green against a dist stamped one day stale, so no
      # test can catch it. It has to be caught here, against the clock, at deploy time.
      # Accepted cost: a build that legitimately straddles midnight SGT goes red. Rare,
      # loud, and fixed by re-running the WHOLE workflow rather than just this job.
      # Inline and duplicated across both deploy jobs on purpose — a shared file would need
      # a checkout, which is the property this block is built to avoid.
      - name: refuse to publish an artifact drawn for another day
        run: |
          STAMP=$(grep -o 'name="build-date" content="[0-9-]*"' dist/index.html | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | head -1)
          TODAY=$(TZ=Asia/Singapore date +%F)
          if [ -z "$STAMP" ]; then
            echo "::error::dist/index.html carries no build-date stamp, so the age of this artifact cannot be established."
            exit 1
          fi
          if [ "$STAMP" != "$TODAY" ]; then
            echo "::error::artifact was drawn for $STAMP but today is $TODAY in Asia/Singapore. Push a commit, or dispatch this workflow against the ref you want published, so the build re-derives the day. Do NOT reach for Re-run all jobs on an OLD run: that rebuilds the old commit, stamps it today, passes this gate, and publishes that older tree over whatever is live."
            exit 1
          fi
          echo "artifact build-date $STAMP matches today in Asia/Singapore."

      # Hardcoded because this job has no checkout and therefore cannot read `.nvmrc`, which
      # is the single source of truth for the build job. The alternative is a sparse-checkout
      # of one file, which costs the "no repository source in the runner" property above.
      # `tests/workflow-guards.test.ts` compares every hardcoded version in every workflow to
      # `.nvmrc`, so bumping the file without bumping these two literals is red rather than
      # silent — which is what it used to be, and this comment used to say so.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - id: deploy
        name: wrangler pages deploy (preview)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # A repository VARIABLE, not a secret: it is a 32-hex value printed in every
          # dashboard URL and in wrangler's own error output, so masking it would redact
          # that substring from unrelated log lines — including the dashboard link wrangler
          # prints when it cannot ascertain a deployment's status. It is also FUNCTIONALLY
          # REQUIRED, not a convenience: wrangler's `getActiveAccountId` resolves it with no
          # API call, and without it falls back to `GET /accounts`, which a Pages-scoped
          # token cannot do — producing an auth error that looks like a bad token.
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          # A PATH, not a DIRECTORY. `WRANGLER_OUTPUT_FILE_DIRECTORY` names the file
          # `wrangler-output-<timestamp>-<6 random hex>.json`, which a later step cannot
          # address. Verified in wrangler's own `getOutputFilePath()`.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.json
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # WHAT THE VERSION PIN BUYS, STATED HONESTLY: it pins wrangler's own version and NOT
        # its dependency tree. `npx` consults no lockfile, so nothing in this repository holds
        # an integrity expectation for a single package it resolves — and it resolves them in
        # this step, beside the deploy token, while every `uses:` above is SHA-pinned for
        # exactly that threat. That fact is durable and does not depend on how big the tree is,
        # which is why no count is written here any more: the last one had rotted, and while it
        # was wrong it also pointed the reader at the safe half of the graph.
        #
        # WHAT KEEPS THIS LOW IS AN INTERSECTION RATHER THAN THE PIN. Two sets: the packages
        # that can re-resolve on any deploy because something names them by a range, and the
        # packages that run code at install time. They are disjoint today — every install-script
        # package is reached only by exact versions, so a fresh resolve cannot substitute one.
        # NOTHING OBSERVES THAT, so re-derive it rather than trusting this line. Adding the same
        # wrangler pin to an empty directory with pnpm names the install-script packages
        # outright, in an "Ignored build scripts" line, because pnpm refuses to run them; then
        # read the range each of their dependents declares. The day one of them is named by a
        # range instead, this paragraph is wrong and the step is no longer LOW.
        #
        # `--ignore-scripts` below closes the executing half whatever that intersection does,
        # and `tests/workflow-guards.test.ts` is what keeps the flag on both deploys across a
        # version bump — Dependabot moves WRANGLER_VERSION without re-checking any of this.
        #
        # The token's scope bounds the blast radius and does NOT bound this: `Cloudflare Pages:
        # Edit` on one account cannot touch DNS, zones or Workers, but it can publish arbitrary
        # content to the project that serves calvin.sg, which is the thing being protected here.
        # Closing the resolve properly needs a committed lockfile and therefore a checkout,
        # which trades away the property described at the top of this block. Cloudflare's own
        # `wrangler-action` has the same shape.
        run: |
          npx --yes --ignore-scripts "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name="${PAGES_PROJECT}" \
            --branch="pr-${PR_NUMBER}" \
            --commit-hash="${HEAD_SHA}"
          node -e '
            const fs = require("fs");
            const want = process.argv[1];
            const out = process.env.WRANGLER_OUTPUT_FILE_PATH;
            let entries;
            try {
              entries = fs.readFileSync(out, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l));
            } catch (err) {
              console.error("::error::could not read or parse " + out + ": " + err.message);
              process.exit(1);
            }
            const d = entries.reverse().find((e) => e.type === "pages-deploy-detailed");
            if (!d) {
              console.error("::error::wrangler wrote no pages-deploy-detailed entry to " + out);
              process.exit(1);
            }
            if (d.environment !== want) {
              console.error("::error::deployed to " + d.environment + ", expected " + want +
                " (project production_branch=" + d.production_branch + ")");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "url=" + d.url + "\nalias=" + (d.alias || "") + "\n");
          ' preview

      - name: summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ALIAS: ${{ steps.deploy.outputs.alias }}
        run: |
          {
            echo "### Preview deployed"
            echo ""
            echo "- $URL"
            if [ -n "$ALIAS" ] && [ "$ALIAS" != "$URL" ]; then echo "- $ALIAS"; fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-production:
    name: deploy production
    needs: build
    # AN ALLOW-LIST OF EVENTS, AND A REF TEST. Both halves are load-bearing, and the allow-list
    # is deliberate: the obvious spelling, `!= 'pull_request'`, is a DENY-list, so every trigger
    # added to `on:` in future would deploy production BY DEFAULT. That is not hypothetical —
    # `pull_request_target` and `issue_comment` both carry `github.ref` = `refs/heads/main`, so
    # they would satisfy the ref test too, and `pull_request_target` is the one that runs
    # PR-authored refs with secrets available. Naming the two events that may publish means a
    # new trigger is inert here until someone adds it on purpose.
    #
    # The ref test is what stops a `workflow_dispatch` on a feature branch: this job hardcodes
    # `--branch=main`, so without it that branch's artifact reaches production and the output
    # assertion below cheerfully confirms `environment: production`, because it genuinely did.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The `production` environment holds CLOUDFLARE_API_TOKEN behind a deployment branch
    # policy limited to `main`. That is a STRUCTURAL control and it fails differently from
    # the `if:` above: a job on another ref cannot read the secret at all, where the guard
    # is a convention a refactor can drop. Both are here for that reason.
    #
    # WHAT IT DOES NOT BUY IS A CAPABILITY DIFFERENCE. `preview`'s token is the same
    # account-scoped `Pages: Edit` — Cloudflare offers no per-project scope for Pages — so
    # either token can publish production. The policy binds THIS COPY to `main`; it is not a
    # limit on what the other one can do. The invariant that keeps it meaningful is that
    # `CLOUDFLARE_API_TOKEN` must exist ONLY as an environment secret: a repository-level
    # secret of the same name is inherited by any job that omits `environment:`, and then
    # the branch policy is void with nothing reporting it.
    environment:
      name: production
      url: https://calvindotsg.pages.dev
    concurrency:
      group: pages-production
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      # THE ARTIFACT IS PERISHABLE AND NOTHING ELSE CHECKS ITS AGE. The build stamps the
      # Singapore calendar day into every page, and "re-run failed jobs" does NOT re-run
      # `build` — so a deploy that fails at 23:xx SGT and is re-run the next morning
      # republishes yesterday's dist: wrong build-date, wrong countdown, and races finished
      # overnight still drawn as unearned outlines. Netlify could not hit this, because its
      # retry re-ran the build command and re-derived the day; this design cannot.
      # MEASURED: the suite is 319/319 green against a dist stamped one day stale, so no
      # test can catch it. It has to be caught here, against the clock, at deploy time.
      # Accepted cost: a build that legitimately straddles midnight SGT goes red. Rare,
      # loud, and fixed by re-running the WHOLE workflow rather than just this job.
      # Inline and duplicated across both deploy jobs on purpose — a shared file would need
      # a checkout, which is the property this block is built to avoid.
      - name: refuse to publish an artifact drawn for another day
        run: |
          STAMP=$(grep -o 'name="build-date" content="[0-9-]*"' dist/index.html | grep -o '[0-9]\{4\}-[0-9]\{2\}-[0-9]\{2\}' | head -1)
          TODAY=$(TZ=Asia/Singapore date +%F)
          if [ -z "$STAMP" ]; then
            echo "::error::dist/index.html carries no build-date stamp, so the age of this artifact cannot be established."
            exit 1
          fi
          if [ "$STAMP" != "$TODAY" ]; then
            echo "::error::artifact was drawn for $STAMP but today is $TODAY in Asia/Singapore. Push a commit, or dispatch this workflow against the ref you want published, so the build re-derives the day. Do NOT reach for Re-run all jobs on an OLD run: that rebuilds the old commit, stamps it today, passes this gate, and publishes that older tree over whatever is live."
            exit 1
          fi
          echo "artifact build-date $STAMP matches today in Asia/Singapore."

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - id: deploy
        name: wrangler pages deploy (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler.json
          HEAD_SHA: ${{ github.sha }}
        run: |
          npx --yes --ignore-scripts "wrangler@${WRANGLER_VERSION}" pages deploy dist \
            --project-name="${PAGES_PROJECT}" \
            --branch=main \
            --commit-hash="${HEAD_SHA}"
          # `--branch=main` is production ONLY if the project's stored production_branch is
          # also `main`; wrangler decides with `isProduction = project.production_branch ===
          # branch` and says nothing when it is false. Get it wrong and every "production"
          # deploy is a preview, calvindotsg.pages.dev serves the last real one, and nothing
          # reports it. The reader asserts the environment came back `production`, so the
          # misconfiguration fails the run instead of shipping.
          # Duplicated verbatim from deploy-preview, and kept that way deliberately: hoisting
          # it into a committed .mjs would need a checkout in the token-holding job.
          node -e '
            const fs = require("fs");
            const want = process.argv[1];
            const out = process.env.WRANGLER_OUTPUT_FILE_PATH;
            let entries;
            try {
              entries = fs.readFileSync(out, "utf8").split("\n").filter(Boolean).map((l) => JSON.parse(l));
            } catch (err) {
              console.error("::error::could not read or parse " + out + ": " + err.message);
              process.exit(1);
            }
            const d = entries.reverse().find((e) => e.type === "pages-deploy-detailed");
            if (!d) {
              console.error("::error::wrangler wrote no pages-deploy-detailed entry to " + out);
              process.exit(1);
            }
            if (d.environment !== want) {
              console.error("::error::deployed to " + d.environment + ", expected " + want +
                " (project production_branch=" + d.production_branch + ")");
              process.exit(1);
            }
            fs.appendFileSync(process.env.GITHUB_OUTPUT,
              "url=" + d.url + "\nalias=" + (d.alias || "") + "\n");
          ' production

      - name: summary
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          {
            echo "### Production deployed"
            echo ""
            echo "- $URL"
          } >> "$GITHUB_STEP_SUMMARY"
