# octoDNS manager config for calvin.sg.
#
# Run from the REPOSITORY ROOT, not from this directory — `directory:` below resolves against
# the working directory, not against this file:
#
#   octodns-sync --config-file dns/config.yaml                      # plan only; writes nothing
#   octodns-sync --config-file dns/config.yaml --checksum=<sha256>  # applies THAT plan
#
# NOT `--doit`. With `enable_checksum: true` below, octodns documents `--doit` as ignored, so a
# run given it and nothing else still writes nothing — and, far more dangerously, a run given a
# checksum writes WITHOUT it. This block said `--doit  # applies` until 2026-07-31 and was
# contradicted fifteen lines further down by the comment that explains why. Believing the wrong
# half of a file that disagrees with itself is how someone concludes a run is safe because they
# left `--doit` off.
#
# Three settings in here are load-bearing in the sense that getting them wrong takes something
# down rather than producing an error. Each is commented at the point it appears, and
# `tests/dns-config.test.ts` fails if any of them is edited away.

# Makes a dry run emit `checksum=<sha256>` over the computed plan, and makes an apply refuse
# unless it is handed that same checksum. It is `terraform plan -out` for DNS: what gets applied
# is the plan a human read, and if the zone moved underneath it in the meantime the apply fails
# instead of writing something nobody reviewed.
#
# IT ALSO MOVES WHERE THE SAFETY LIVES, WHICH IS THE PART THAT SURPRISES PEOPLE. Once this is
# on, `--doit` stops being the thing that decides — octodns' own help says it is "ignored when
# Manager.enable_checksum is used", and `Manager.sync` has no dry-run guard on its apply loop
# (manager.py:1135 is the only exit, `if dry_run and not checksum: return 0`). So
# `octodns-sync --checksum=...` WRITES, with or without `--doit`.
#
# The rule that follows is short: a run that must not write must not be given a checksum.
# `.github/workflows/dns.yml` splits exactly on that, and gives the planning job a read-only
# token as well so that two independent things would have to be wrong before anything changed.
manager:
  enable_checksum: true

providers:
  config:
    class: octodns.provider.yaml.YamlProvider
    directory: ./dns/zones

  cloudflare:
    class: octodns_cloudflare.CloudflareProvider
    token: env/CLOUDFLARE_DNS_TOKEN

    # NOT THE DEFAULT, AND THE MOST DANGEROUS LINE IN THIS FILE.
    #
    # `pagerules` defaults to TRUE. With it on, the provider adds URLFWD to SUPPORTS, reads
    # the zone's legacy Page Rules as if they were records, and deletes any it cannot find in
    # `zones/`. This zone file declares no URLFWD records and never will — so on the default
    # the very first plan plausibly proposes deleting the redirect rules, including the one
    # that makes www 301 to the apex and the one that forwards slickshots to Instagram.
    #
    # Those rules were created by hand in the dashboard one day before this file existed.
    # Redirects are not DNS and are not managed here; false makes the provider blind to them
    # rather than merely quiet about them.
    pagerules: false

processors:
  # Cloudflare Email Routing owns these three MX records and marks them `meta.email_routing`.
  # Managing them here would mean this file becoming the source of truth for inbound mail,
  # which it must not be — the routing UI would rewrite them and the next plan would fight it.
  #
  # A REJECT LIST IS NOT A DELETE LIST. `include_target` defaults to true, which removes the
  # record from BOTH the desired and the existing zone before the diff is taken, so no Delete
  # can be generated for it. Setting it to false is what would allow deletion. Do not "fix"
  # the polarity — `dns/test_filters.py` executes this on the pinned version and proves it.
  email-routing-owns-the-mx:
    class: octodns.processor.filter.TypeRejectlistFilter
    rejectlist:
      - MX

  names-not-managed-here:
    class: octodns.processor.filter.NameRejectlistFilter
    rejectlist:
      # The Email Routing DKIM key. Cloudflare marks it `read_only` on top of `email_routing`,
      # so excluding it is not tidiness — the API refuses to write it, and a plan containing it
      # would fail at apply rather than at review.
      #
      # MATCHED BY SUFFIX, NOT BY NAME, because the selector carries a year. This was
      # `cf2024-1._domainkey` until 2026-07-31, which excluded exactly today's key and nothing
      # else: when Cloudflare rotates to `cf2025-1._domainkey` the new name is unexcluded, so it
      # is in the live zone, absent from this file, and the diff plans a DELETE of a key the API
      # will not let anyone delete. Executed before changing it — a rotated selector added to the
      # fixture in `test_filters.py` planned `Delete TXT cf2025-1._domainkey`.
      #
      # A leading and trailing `/` is how octoDNS marks a pattern as a regex, applied with
      # `re.search` (`octodns/processor/filter.py:124`). This one therefore covers every DKIM
      # selector at any name, which is the whole class rather than this year's instance.
      - '/\._domainkey$/'
      # DMARC. WHAT IS TRUE IS THE PLAIN FACT: the record is live and correct, and it is simply
      # not managed from git. Bringing it under octoDNS is a decision nobody has taken, which is
      # not the same as one taken against.
      #
      # THE PRIVACY ARGUMENT THAT USED TO SIT HERE WAS FALSE, and it is named rather than
      # quietly dropped because it is exactly the kind of reason a future reader would act on.
      # It said that this record's reporting address is a personal mailbox, that no email
      # address appears anywhere else in this public repository, and that adding one here would
      # be the first. The second clause was untrue when it was written: a tracked file this site
      # serves at its own root, and links to from the home page, already carries that same
      # address. Verified by hashing both values rather than printing either — the SHA-256
      # digests match. So this exclusion never bought the privacy it claimed to, and restoring
      # the argument would only re-import the mistake. Publishing the address is a settled
      # matter elsewhere in the repository; it is not what this line is deciding.
      #
      # TO ADOPT IT: add the record to `zones/calvin.sg.yaml` FIRST, then delete this line — in
      # that order. This comment used to read "delete this line to adopt it", which is backwards
      # and destructive: deleting the line alone makes the name visible to the diff, which then
      # finds it in the live zone and absent from the zone file and plans a DELETE. Executed
      # rather than reasoned — removing this line and planning yields exactly `Delete TXT _dmarc`.
      - _dmarc

zones:
  calvin.sg.:
    sources:
      - config
    processors:
      - email-routing-owns-the-mx
      - names-not-managed-here
    targets:
      - cloudflare
