# The calvin.sg zone, as octoDNS sees it.
#
# THIS FILE IS NOT THE WHOLE ZONE, AND IT IS NOT MEANT TO BE. Three groups of records are
# deliberately absent, each for a different reason; `../config.yaml` names them at the point it
# excludes them. Adding a record here that is on one of those reject lists does nothing. Adding
# one that is not, and applying, changes live DNS.
#
# `ttl: 300` IS NOT WHAT CLOUDFLARE STORES, AND IT IS ALSO NOT LOAD-BEARING. Cloudflare stores
# 1, meaning automatic. The provider normalises that to 300 on read (`_ttl_data`,
# octodns_cloudflare/__init__.py:272) and carries the real setting in `auto-ttl` instead — and
# because every record here is auto-ttl, the provider copies the existing TTL over the desired
# one before comparing them (`_include_change`, :693, "TTLs are ignored for these"). So the
# number is inert: 300 and 1 both diff to nothing. It is written as 300 only because that is
# what octoDNS emits when it dumps this zone, which keeps the file equal to a regeneration.
#
# That inertness is worth stating because it is the one field here the checks cannot see.
# Editing it is harmless; expecting a test to stop you is not.
#
# KEYS ARE SORTED BECAUSE OCTODNS REFUSES TO PARSE THEM OTHERWISE — it raises
# `keys out of order` rather than warning, so a hand-added record in a natural reading order
# fails loudly rather than silently. Sorted names, then `octodns`, `ttl`, `type`, `value`.
#
# Bootstrapped from the live zone on 2026-07-31 via `cf dns records list --zone calvin.sg`,
# then written by octoDNS itself so the ordering is canonical rather than guessed.

# The apex. ALIAS, not CNAME, because a CNAME may not legally sit beside SOA and NS. Cloudflare
# implements the same thing as a flattened root CNAME and the provider converts between the two
# spellings in both directions (octodns_cloudflare/__init__.py:555 reading, :938 writing) — so
# ALIAS here and CNAME in the dashboard are the same record, not a discrepancy.
"":
  - octodns:
      cloudflare:
        auto-ttl: true
        proxied: true
    ttl: 300
    type: ALIAS
    value: calvindotsg.pages.dev.

  # Two Google Search Console verifications and SPF. SPF is managed here while the MX records
  # beside it are not, and the asymmetry is Cloudflare's own: it marks the MX records
  # `meta.email_routing` and leaves this record's `meta` empty.
  #
  # ONLY ONE OF THE TWO VERIFICATION TOKENS IS ACCOUNTED FOR, AND BOTH STAY. Checked in Search
  # Console on 2026-08-28: across both signed-in Google accounts there is exactly ONE property,
  # the domain property `sc-domain:calvin.sg`, verified by "Domain name provider" — which needs
  # one token. Every URL-prefix property that could have justified a second (apex and www, both
  # schemes) answers "you don't have access to this property". The two records were created six
  # weeks apart in 2022, which fits a property that has since been deleted.
  #
  # A token is not self-describing, so nothing from outside Google can say WHICH of the two the
  # live property uses. The trade is one-sided: an unused verification TXT is inert and costs
  # nothing, while deleting the wrong one un-verifies the property — and Search Console re-checks
  # on its own schedule, so the failure surfaces days later with the gap already in the data.
  # Do not tidy one away on the reasoning that only one is needed. That is true and insufficient.
  - octodns:
      cloudflare:
        auto-ttl: true
    ttl: 300
    type: TXT
    values:
      - google-site-verification=jFiJ01OUV_Mmxa0ptV9HaXWeOqXO67456dAbTlgTcZk
      - google-site-verification=l7o6u3vVat-T_oPwXJQjdAabpMlVVUZvfmRygupTsY0
      - v=spf1 include:_spf.mx.cloudflare.net ~all

# The Hermes agent's dashboard, on a Hetzner box in nbg1. `proxied: true` IS LOAD-BEARING HERE,
# unlike on the records around it: a `cfargotunnel.com` target has no public address and resolves
# only through Cloudflare's edge, so an unproxied version of this record is simply broken rather
# than merely direct.
#
# There is no origin to reach without Cloudflare Access in front of it either — the box publishes
# no inbound port for this, and the dashboard binds to 127.0.0.1 on the host.
hermes:
  octodns:
    cloudflare:
      auto-ttl: true
      proxied: true
  ttl: 300
  type: CNAME
  value: 7016c4ba-d138-48e7-a7f1-2ec672540ce8.cfargotunnel.com.

# SSH to the same box and the same tunnel, on its own hostname because `cloudflared access ssh`
# needs one it does not share with an HTTP application. Same tunnel UUID as `hermes` above; the
# tunnel's own ingress rules decide which local port each hostname reaches.
ssh-hermes:
  octodns:
    cloudflare:
      auto-ttl: true
      proxied: true
  ttl: 300
  type: CNAME
  value: 7016c4ba-d138-48e7-a7f1-2ec672540ce8.cfargotunnel.com.

# The Telegram Mini App at today.calvin.sg. THERE IS NO ORIGIN BEHIND THIS RECORD, and that is
# what it is for: `100::` is the IPv6 discard prefix (RFC 6666), a documented Cloudflare pattern
# for a hostname answered entirely by a Worker. `proxied: true` is therefore load-bearing in the
# same way it is on `hermes` above — unproxied, this record resolves to a black hole and nothing
# else. The Worker attaches by ROUTE (`today.calvin.sg/*`), which is not DNS and is invisible to
# octoDNS.
#
# A WORKERS "CUSTOM DOMAIN" WOULD HAVE BEEN THE OBVIOUS CHOICE AND IS THE WRONG ONE. Cloudflare
# creates and manages the DNS record for a custom domain itself, behind this file's back — so the
# Monday drift run would find a record in the zone that is not here, and fail, every week, for as
# long as the app exists. The route-plus-this-record split is what keeps this file the sole owner
# of the name. See calvindotsg/today-mini-app's wrangler.jsonc, which says the same thing from
# the other side.
today:
  octodns:
    cloudflare:
      auto-ttl: true
      proxied: true
  ttl: 300
  type: AAAA
  value: '100::'

# www DOES NOT SERVE THE SITE, and this record is not left over from when it did. It is proxied
# so that requests reach Cloudflare's edge at all; a redirect rule then answers them with a 301
# to the apex, before origin selection happens. www was detached from the Pages project on
# 2026-07-30 precisely so that this record routes to the edge and nowhere else. Deleting it does
# not tidy the redirect away — it strands it, because nothing would reach the edge to be
# redirected.
www:
  octodns:
    cloudflare:
      auto-ttl: true
      proxied: true
  ttl: 300
  type: CNAME
  value: calvindotsg.pages.dev.
