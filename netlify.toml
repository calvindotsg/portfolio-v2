# This file is the single source of truth for the build. The build command in the
# Netlify UI is deliberately EMPTY -- do not re-add it.
#
# Netlify resolves `netlify.toml` over the UI setting, so having both meant
# `netlify api getSite` reported a stale `cmd` that had not run for some time.
# That is a trap: the dashboard looks authoritative and is not. Verify what
# actually runs with `netlify build --dry`, which prints the resolved source
# ("build.command from netlify.toml").
#
# `publish` is intentionally still ALSO set in the UI. If this file were ever
# deleted, an empty publish directory makes Netlify serve the repository root --
# i.e. publish the source. Leaving `dir = "dist"` in the UI means that scenario
# fails loudly (dist/ is gitignored and would not exist) instead of leaking.
#
# `pnpm test` runs the build itself via tests/setup/build.ts globalSetup, so this
# is one build that also gates the deploy on typechecking and the assertion
# suite. A failing suite fails the deploy and production keeps serving the
# previous build.
#
# THE NODE VERSION OF THIS BUILD IS SET BY `.nvmrc`, NOT BY ANYTHING IN THIS FILE.
# Netlify's precedence is `.nvmrc` > `.node-version` > the `NODE_VERSION` environment
# variable > the UI setting, so `.nvmrc` sits at the TOP and adding `NODE_VERSION`
# here would NOT override it. That file was added for GitHub Actions ("so CI and the
# laptop cannot diverge") and moved this host from Node 22 to 26 as a side effect --
# green, but nobody aimed it. The coupling is easy to miss precisely because a
# `.nvmrc` cannot carry a comment of its own, so it is recorded here: while this file
# lives, bumping `.nvmrc` for a CI reason also repoints the build that ships
# calvin.sg. Verify what a build actually resolved by reading its log for
# "Attempting Node.js version" rather than trusting the dashboard, which -- see above
# -- looks authoritative and is not.
[build]
  command = "pnpm check && pnpm test"
  publish = "dist"

# Every asset under /_astro/ is content-addressed -- Astro puts a hash of the file's
# own contents in its name, so a changed file is a changed URL and a given URL can
# never mean two things. That is the precondition for caching it forever, and it is
# the thing worth guarding rather than this header: `tests/build-output.test.ts`
# asserts that every emitted /_astro/ filename carries a hash, because the day one
# does not is the day this rule starts serving a stale file for a year.
#
# Without it the site served `public,max-age=0,must-revalidate` on hashed assets --
# verified on production -- so a reader moving from / to /patches paid a full round
# trip to be told nothing had changed. Measured on the built site at Slow-4G, the
# destination's two stylesheets: 168ms and 175ms, transferSize 300 bytes each, i.e.
# a 304 carrying no content at all. With this they resolve from cache in 0.0-0.3ms.
#
# It buys a returning reader ~170ms of a render-blocking wait and buys a first-time
# reader nothing, which is the honest split: an empty cache has nothing to
# revalidate. Do not quote it as a first-visit improvement.
#
# HTML is deliberately left alone. It is not content-addressed, and a stale page is
# a much worse failure than a slow one.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Build plugins are intentionally left installed via the Netlify UI rather than
# declared here (netlify-purge-cloudflare-on-deploy, @netlify/plugin-lighthouse).
# Declaring them in both places is the same ambiguity this file just removed, and
# a UI-installed plugin can only be removed from the UI -- so moving them would
# need a manual step that cannot be verified from the repo.
